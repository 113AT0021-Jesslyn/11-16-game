<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpongeBob Racing</title>
  <style>
    :root {
      --bg1: #072d4a;
      --bg2: #0a4f72;
      --track: #102f4d;
      --lane: #1b5f87;
      --road: #3a7ca3;
      --ui: #eaf7ff;
      --accent: #ffd84d;
      --danger: #ff5d5d;
      --success: #78f0a2;
      --sponge: #f7dd6b;
      --sponge-dark: #f0c643;
      --rival: #ff9a5a;
      --star: #ffe66d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      font-family: Arial, sans-serif;
      color: var(--ui);
    }

    .game-shell {
      width: min(920px, 96vw);
      background: rgba(8, 23, 42, 0.82);
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(7, 25, 42, 0.95);
      border-bottom: 2px solid rgba(255,255,255,0.12);
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 3vw, 2rem);
      letter-spacing: 0.06em;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat {
      background: rgba(27, 60, 87, 0.9);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 8px 12px;
      min-width: 120px;
      text-align: center;
    }

    .stat small {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d9f4ff;
      opacity: 0.8;
      margin-bottom: 4px;
    }

    canvas {
      display: block;
      width: 100%;
      background: linear-gradient(180deg, #0e4a6d 0%, #0b3458 100%);
      border-bottom: 2px solid rgba(255,255,255,0.12);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(7, 25, 42, 0.95);
      flex-wrap: wrap;
    }

    .controls {
      font-size: 0.96rem;
      color: #dfeef7;
      line-height: 1.6;
    }

    button {
      background: linear-gradient(180deg, #4ecdc4, #25a18e);
      color: white;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 640px) {
      .hud, .footer {
        justify-content: center;
      }
      .controls {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <h1>SpongeBob Racing</h1>
      <div class="stats">
        <div class="stat"><small>Speed</small><span id="speedValue">0</span></div>
        <div class="stat"><small>Distance</small><span id="distanceValue">0m</span></div>
        <div class="stat"><small>Timer</small><span id="timerValue">45</span></div>
      </div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>

    <div class="footer">
      <div class="controls">
        Move: A/D or Arrow Keys<br />
        Boost: W / Up<br />
        Brake: S / Down
      </div>
      <button id="restartButton">Restart</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const speedValue = document.getElementById('speedValue');
    const distanceValue = document.getElementById('distanceValue');
    const timerValue = document.getElementById('timerValue');
    const restartButton = document.getElementById('restartButton');

    const keys = {};
    const lanePositions = [170, 300, 430, 560, 690];
    const finishDistance = 1800;

    let lastTime = 0;
    let gameState = 'playing';

    const player = {
      x: 450,
      y: 420,
      width: 46,
      height: 42,
      speed: 0,
      targetSpeed: 0,
      maxSpeed: 480,
      health: 3,
      boostTimer: 0,
      lane: 2
    };

    const rivals = [
      { x: 170, y: 50, color: '#ff9a5a', progress: 0, name: 'Patric' },
      { x: 430, y: 90, color: '#66d9ff', progress: 0, name: 'Gary' },
      { x: 690, y: 130, color: '#9ae66e', progress: 0, name: 'Plankton' }
    ];

    let distance = 0;
    let timer = 45;
    let stars = [];
    let obstacles = [];
    let particles = [];

    function resetGame() {
      gameState = 'playing';
      distance = 0;
      timer = 45;
      player.x = lanePositions[2];
      player.y = 420;
      player.speed = 0;
      player.targetSpeed = 0;
      player.health = 3;
      player.boostTimer = 0;
      player.lane = 2;
      stars = [];
      obstacles = [];
      particles = [];
      rivals.forEach((rival, index) => {
        rival.x = lanePositions[(index * 2) % lanePositions.length];
        rival.y = 50 + index * 40;
        rival.progress = 0;
      });
      updateHud();
    }

    function updateHud() {
      speedValue.textContent = Math.round(player.speed);
      distanceValue.textContent = Math.round(distance) + 'm';
      timerValue.textContent = Math.max(0, Math.ceil(timer));
    }

    function spawnObstacle() {
      const lane = Math.floor(Math.random() * lanePositions.length);
      obstacles.push({
        x: lanePositions[lane],
        y: -60,
        width: 46,
        height: 42,
        lane,
        color: Math.random() > 0.5 ? '#ff6b6b' : '#7b5e57',
        drift: (Math.random() - 0.5) * 20
      });
    }

    function spawnStar() {
      const lane = Math.floor(Math.random() * lanePositions.length);
      stars.push({
        x: lanePositions[lane],
        y: -30,
        r: 10,
        lane,
        rotation: Math.random() * Math.PI * 2
      });
    }

    function createBurst(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 180,
          vy: (Math.random() - 0.5) * 180,
          life: 0.7 + Math.random() * 0.5,
          color
        });
      }
    }

    function handleInput() {
      if (keys['ArrowLeft'] || keys['a']) {
        player.lane = Math.max(0, player.lane - 1);
      }
      if (keys['ArrowRight'] || keys['d']) {
        player.lane = Math.min(lanePositions.length - 1, player.lane + 1);
      }
      if (keys['ArrowUp'] || keys['w']) {
        player.targetSpeed = Math.min(player.maxSpeed, player.targetSpeed + 140);
      }
      if (keys['ArrowDown'] || keys['s']) {
        player.targetSpeed = Math.max(80, player.targetSpeed - 220);
      }

      if (player.lane >= 0 && player.lane < lanePositions.length) {
        player.x += (lanePositions[player.lane] - player.x) * 0.2;
      }
    }

    function checkCollisions() {
      for (const obstacle of obstacles) {
        if (rectsOverlap(player, obstacle)) {
          createBurst(player.x, player.y, '#ff7b7b');
          player.health -= 1;
          obstacle.y = canvas.height + 200;
          if (player.health <= 0) {
            gameState = 'lost';
          }
        }
      }

      for (const star of stars) {
        if (distanceBetween(player.x, player.y, star.x, star.y) < 26) {
          player.targetSpeed = Math.min(player.maxSpeed + 100, player.targetSpeed + 120);
          player.boostTimer = 2.5;
          star.y = canvas.height + 60;
          createBurst(star.x, star.y, '#ffe66d');
          distance += 120;
        }
      }
    }

    function rectsOverlap(a, b) {
      return (
        a.x - a.width / 2 < b.x + b.width / 2 &&
        a.x + a.width / 2 > b.x - b.width / 2 &&
        a.y - a.height / 2 < b.y + b.height / 2 &&
        a.y + a.height / 2 > b.y - b.height / 2
      );
    }

    function distanceBetween(x1, y1, x2, y2) {
      return Math.hypot(x1 - x2, y1 - y2);
    }

    function update(delta) {
      if (gameState !== 'playing') return;

      timer -= delta;
      if (timer <= 0) {
        gameState = 'lost';
      }

      handleInput();

      if (player.boostTimer > 0) {
        player.boostTimer -= delta;
      }

      const acceleration = player.boostTimer > 0 ? 220 : 130;
      player.speed += (player.targetSpeed - player.speed) * Math.min(1, acceleration * delta / 180);
      if (player.speed < 130) player.speed = 130;

      distance += player.speed * delta * 0.8;

      if (distance >= finishDistance) {
        gameState = 'won';
      }

      rivals.forEach((rival) => {
        rival.progress += (Math.random() * 30 + 45) * delta;
        const rivalY = 50 + rival.progress * 0.15;
        if (rivalY > canvas.height + 30) rivalY = canvas.height + 30;
        rival.y = rivalY;
      });

      const spawnInterval = Math.max(0.5, 1.1 - player.speed / 800);
      if (Math.random() < delta / spawnInterval) {
        spawnObstacle();
      }
      if (Math.random() < delta / 1.6) {
        spawnStar();
      }

      obstacles.forEach((obstacle) => {
        obstacle.y += (player.speed + 160) * delta;
        obstacle.x += obstacle.drift * delta;
      });

      stars.forEach((star) => {
        star.y += (player.speed + 140) * delta;
        star.rotation += delta * 5;
      });

      particles.forEach((particle) => {
        particle.x += particle.vx * delta;
        particle.y += particle.vy * delta;
        particle.life -= delta;
      });

      for (let i = obstacles.length - 1; i >= 0; i--) {
        if (obstacles[i].y > canvas.height + 80) {
          obstacles.splice(i, 1);
        }
      }

      for (let i = stars.length - 1; i >= 0; i--) {
        if (stars[i].y > canvas.height + 80) {
          stars.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }

      checkCollisions();
      updateHud();
    }

    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, '#0d4e73');
      sky.addColorStop(1, '#0a3555');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 18; i++) {
        const bubbleX = (i * 57 + (distance * 0.7)) % (canvas.width + 60) - 30;
        const bubbleY = (i * 63) % (canvas.height + 30);
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.arc(bubbleX, bubbleY, 8, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < 5; i++) {
        const x = i * 180 + (distance * 0.2 % 30);
        ctx.fillStyle = '#1f7d9d';
        ctx.fillRect(x, 30, 80, 18);
      }

      ctx.fillStyle = '#0c2b45';
      ctx.fillRect(110, 0, 680, canvas.height);

      for (let lane = 1; lane < 5; lane++) {
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(110 + lane * 140, 0);
        ctx.lineTo(110 + lane * 140, canvas.height);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(110, 0, 680, 36);
      ctx.fillRect(110, canvas.height - 36, 680, 36);

      ctx.fillStyle = '#28b7d4';
      ctx.fillRect(110, 0, 680, 10);
      ctx.fillRect(110, canvas.height - 10, 680, 10);

      ctx.fillStyle = '#b2e6a2';
      for (let i = 0; i < 20; i++) {
        const x = (i * 90 + distance * 0.8) % (canvas.width + 60) - 30;
        const y = canvas.height - 24 - (i % 3) * 8;
        ctx.fillRect(x, y, 18, 28);
      }
    }

    function drawPlayer() {
      const x = player.x;
      const y = player.y;

      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = player.boostTimer > 0 ? '#fce083' : '#f7df6d';
      ctx.beginPath();
      ctx.roundRect(-22, -18, 44, 36, 12);
      ctx.fill();

      ctx.fillStyle = '#f4c542';
      ctx.beginPath();
      ctx.arc(0, -7, 10, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0b2f4a';
      ctx.fillRect(-6, -6, 12, 4);
      ctx.fillRect(-18, 6, 8, 10);
      ctx.fillRect(10, 6, 8, 10);

      if (player.boostTimer > 0) {
        ctx.fillStyle = '#7ae7ff';
        ctx.beginPath();
        ctx.moveTo(-26, 8);
        ctx.lineTo(-38, 22);
        ctx.lineTo(-18, 18);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(26, 8);
        ctx.lineTo(38, 22);
        ctx.lineTo(18, 18);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    function drawRivals() {
      rivals.forEach((rival) => {
        ctx.save();
        ctx.translate(rival.x, rival.y);
        ctx.fillStyle = rival.color;
        ctx.beginPath();
        ctx.roundRect(-18, -18, 36, 30, 10);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(-7, -8, 14, 3);
        ctx.fillRect(-15, 8, 8, 8);
        ctx.fillRect(7, 8, 8, 8);
        ctx.restore();
      });
    }

    function drawObstacles() {
      obstacles.forEach((obstacle) => {
        ctx.save();
        ctx.translate(obstacle.x, obstacle.y);
        ctx.fillStyle = obstacle.color;
        ctx.beginPath();
        ctx.roundRect(-20, -18, 40, 36, 12);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-12, 6, 24, 10);
        ctx.restore();
      });
    }

    function drawStars() {
      stars.forEach((star) => {
        ctx.save();
        ctx.translate(star.x, star.y);
        ctx.rotate(star.rotation);
        ctx.fillStyle = '#ffe66d';
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const outer = 12;
          const inner = 5;
          const angle = (Math.PI / 180) * (i * 72 - 90);
          const x1 = Math.cos(angle) * outer;
          const y1 = Math.sin(angle) * outer;
          const x2 = Math.cos(angle + Math.PI / 5) * inner;
          const y2 = Math.sin(angle + Math.PI / 5) * inner;
          if (i === 0) ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
    }

    function drawParticles() {
      particles.forEach((particle) => {
        ctx.fillStyle = particle.color;
        ctx.globalAlpha = Math.max(0, particle.life);
        ctx.fillRect(particle.x, particle.y, 5, 5);
        ctx.globalAlpha = 1;
      });
    }

    function drawFinishLine() {
      const finishX = 220;
      for (let i = 0; i < 18; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#fff' : '#0f4a67';
        ctx.fillRect(finishX + 640, i * 28, 20, 22);
      }
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px Arial';
      ctx.fillText('FINISH', finishX + 640, 28);
    }

    function drawHudText() {
      ctx.fillStyle = '#eaf7ff';
      ctx.font = 'bold 20px Arial';
      ctx.fillText('Health: ' + player.health, 20, 28);
      ctx.fillText('Goal: ' + Math.min(Math.round(distance / finishDistance * 100), 100) + '%', 20, 52);
    }

    function drawGameOver() {
      ctx.fillStyle = 'rgba(2, 10, 18, 0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 42px Arial';
      const title = gameState === 'won' ? 'You Win!' : 'Race Over!';
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '22px Arial';
      ctx.fillText('Press Restart to race again', canvas.width / 2, canvas.height / 2 + 30);
      ctx.textAlign = 'left';
    }

    function render() {
      drawBackground();
      drawFinishLine();
      drawRivals();
      drawStars();
      drawObstacles();
      drawPlayer();
      drawParticles();
      drawHudText();

      if (gameState !== 'playing') {
        drawGameOver();
      }
    }

    function gameLoop(timestamp) {
      const delta = Math.min((timestamp - lastTime) / 1000 || 0.016, 0.033);
      lastTime = timestamp;
      update(delta);
      render();
      requestAnimationFrame(gameLoop);
    }

    function handleKeyDown(event) {
      const key = event.key.toLowerCase();
      keys[event.key] = true;
      keys[key] = true;

      if (event.key === ' ' || event.code === 'Space') {
        event.preventDefault();
        player.targetSpeed = Math.min(player.maxSpeed + 120, player.targetSpeed + 180);
      }
    }

    function handleKeyUp(event) {
      const key = event.key.toLowerCase();
      keys[event.key] = false;
      keys[key] = false;
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);
    restartButton.addEventListener('click', resetGame);

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
